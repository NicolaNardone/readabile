<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <title>ReadAbile — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg: #0a0a14; --bg2: #11111f; --accent: #f0a500;
      --accent2: #ff6b6b; --text: #e8e8f0; --text-muted: #8888aa;
      --border: rgba(255,255,255,0.08); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Sora', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 24px;
      padding: 48px 40px; width: 100%; max-width: 400px; text-align: center; }
    .logo { font-family: 'Space Mono', monospace; font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 32px; }
    input[type="password"] { width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px;
      color: var(--text); font-family: 'Space Mono', monospace; font-size: 1rem;
      letter-spacing: 3px; text-align: center; margin-bottom: 16px;
      outline: none; transition: border-color 0.3s; }
    input[type="password"]:focus { border-color: var(--accent); }
    .btn { width: 100%; background: linear-gradient(135deg, var(--accent), #e09000);
      color: #000; border: none; padding: 14px; border-radius: 12px;
      font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.9rem;
      letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .errore { color: var(--accent2); font-size: 0.85rem; margin-bottom: 16px; }
    .badge { display: inline-block; background: rgba(240,165,0,0.15); color: var(--accent);
      border: 1px solid rgba(240,165,0,0.3); padding: 4px 12px; border-radius: 50px;
      font-size: 0.75rem; font-family: 'Space Mono', monospace; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">PANNELLO ADMIN</div>
    <div class="logo">ReadAbile</div>
    <div class="subtitle">Accesso amministratore</div>
    {% if errore %}<div class="errore">⚠ Password errata</div>{% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="••••••••" autofocus/>
      <button type="submit" class="btn">Entra</button>
    </form>
  </div>
</body>
</html>
